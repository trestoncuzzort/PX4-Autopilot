module_name: sensor_airspeed_sim
parameters:
- group: Sensors
  definitions:
    SENS_EN_ARSPDSIM:
      description:
        short: Enable simulated airspeed sensor instance
      type: enum
      values:
        0: Disabled
        1: Enabled
      default: 0
      reboot_required: true
      min: 0
      max: 1
- group: Simulator
  definitions:
    SIM_ARSP_NOISE:
      description:
        short: Differential pressure noise standard deviation
        long: >-
          Additive Gaussian differential pressure noise before pitot blockage scaling.
      type: float
      default: 0.01
      min: 0.0
      decimal: 4
      unit: hPa
