module_name: sensor_gps_sim
parameters:
- group: Sensors
  definitions:
    SENS_EN_GPSSIM:
      description:
        short: Enable simulated GPS instance
      type: enum
      values:
        0: Disabled
        1: Enabled
      default: 0
      reboot_required: true
      min: 0
      max: 1
- group: Simulator
  definitions:
    SIM_GPS_USED:
      description:
        short: simulated GPS number of satellites used
      type: int32
      default: 10
      min: 0
      max: 50
    SIM_GPS_P_NOISE:
      description:
        short: GPS position noise scale
        long: >-
          Scales the output of the existing correlated position noise model. Zero removes its contribution immediately while retaining the underlying noise state. Reported accuracy is unchanged.
      type: float
      default: 1.0
      min: 0.0
      decimal: 3
    SIM_GPS_V_NOISE:
      description:
        short: GPS velocity noise scale
        long: >-
          Scales the output of the existing correlated velocity noise model. Zero removes its contribution immediately while retaining the underlying noise state. Reported accuracy is unchanged.
      type: float
      default: 1.0
      min: 0.0
      decimal: 3
